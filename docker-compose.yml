services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
      POSTGRES_DB: memory
    ports:
      - "5433:5432"   # 5433 on the host so it never fights a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory"]
      interval: 2s
      retries: 20
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # inside the compose network: service name "db", container port 5432 (not the host's 5433)
      MEMORY_DSN: postgresql://app_user:app_user@db:5432/memory
      MEMORY_ADMIN_DSN: postgresql://memory:memory@db:5432/memory
    depends_on:
      db:
        condition: service_healthy
  # Queue worker: same image, different command. Scale with `docker compose up -d --scale worker=3`;
  # SKIP LOCKED keeps workers from taking the same job.
  worker:
    build: .
    command: ["python", "-m", "memory_service.worker"]
    environment:
      WORKER_DSN: postgresql://worker:worker@db:5432/memory
      MEMORY_ADMIN_DSN: postgresql://memory:memory@db:5432/memory
    restart: unless-stopped   # if it starts before the api has run migrations, it exits and retries
    stop_grace_period: 30s    # SIGTERM finishes the current job first
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
# Local AWS (LocalStack) lives in docker-compose.aws.yml, so this file and CI need no token.
# schema lives in migrations/ (alembic upgrade head); the api container runs it on start
volumes:
  pgdata:
